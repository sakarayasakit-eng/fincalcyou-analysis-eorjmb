# Netlify configuration: security + performance headers
# These apply to all routes when deployed via Netlify

[build]
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking protection (belt-and-braces with CSP frame-ancestors)
    X-Frame-Options = "DENY"

    # Prevent MIME-sniffing attacks
    X-Content-Type-Options = "nosniff"

    # HSTS: force HTTPS for 1 year including subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Referrer policy: don't leak full URL to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser APIs that the calculator doesn't need
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"

    # Cross-origin isolation (safe for this app)
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  # Long-cache static assets
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Embed script is loaded cross-origin by third-party sites (backlink channel),
  # so it MUST override the global CORP=same-origin or browsers block it.
  # More specific than /*.js, so its values win for this path.
  # Shorter cache than /*.js so widget fixes reach embedders within the hour.
  for = "/embed.js"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  # Short cache for HTML so updates roll out quickly
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  # Images rarely change — cache 30 days (not immutable, so favicon/og swaps aren't stuck a year)
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  # Sitemap: let crawlers refetch hourly rather than serve a stale copy
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
